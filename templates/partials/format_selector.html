{% if available_sizes %}
<div class="format-selector">
    <span class="label">Kies jouw formaat:</span>
    {% for f in available_sizes %}
    <a href="?size={{ f }}"
       class="button small format-btn {% if f == selected_size %}primary{% endif %}">
        {{ f }} cm
    </a>
    {% endfor %}
    {% if selected_size %}
    <p class="format-active">Je bekijkt momenteel: <strong>{{ selected_size }} cm</strong></p>
    {% endif %}
</div>
{% endif %}
