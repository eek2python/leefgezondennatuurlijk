<section class="newsletter-signup">
    <header class="major">
        <h2>Blijf op de hoogte</h2>
    </header>
    <p>Ontvang tips over gezond koken en de beste PFAS-vrije producten, direct in je inbox.</p>
    <form class="newsletter-form" onsubmit="event.preventDefault(); this.querySelector('.newsletter-thanks').style.display='block'; this.querySelector('button').style.display='none'; this.querySelector('input').style.display='none';">
        <input type="email" placeholder="Je e-mailadres" required>
        <button type="submit" class="button primary small">Aanmelden</button>
        <p class="newsletter-thanks" style="display:none;"><strong>Bedankt voor je aanmelding!</strong> (Integratie volgt binnenkort)</p>
    </form>
</section>
